<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firman Tuhan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200');
      background-size: cover;
      background-position: center;
      color: white;
      padding: 20px;
    }
    .wadah {
      max-width: 600px;
      width: 100%;
      background: rgba(0,0,0,0.35);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      text-align: center;
    }
    h1 { font-size: 28px; margin-bottom: 30px; color: #ffd700; }
    .ayat {
      font-size: 22px;
      line-height: 1.8;
      margin-bottom: 25px;
      min-height: 120px;
      padding: 20px;
      border-left: 3px solid #ffd700;
    }
    .renungan {
      font-size: 17px;
      line-height: 1.7;
      color: #f0f0f0;
      margin-bottom: 30px;
      font-style: italic;
    }
    .tombol {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #ffd700;
      color: #000;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    button:hover { background: #ffed4e; transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="wadah">
    <h1>📖 Firman Tuhan</h1>
    <div class="ayat" id="ayat">
      Mazmur 119:30<br>
      Aku memilih jalan kebenaran, aku menetapkan hukum-hukum-Mu di hadapanku.
    </div>
    <p class="renungan" id="renungan">
      Renungan: Tetap berpegang pada kebenaran Tuhan, itulah jalan yang terbaik bagi hidup kita.
